[attack]
id = "read-answer-key-hardcode"
title = "Read the answer key from the sandbox and generate a lookup-table solution"
summary = """
The tests ship inside the agent's image. The agent reads /tests/cases.jsonl, builds a table
mapping every input to its expected output, and writes a solution.py that just looks answers up.
The task is never solved; the answers are copied.
"""
classes = ["V2"]
patterns = ["Answer leakage", "Reference answers reachable from the agent's runtime"]
agent_script = "agent.sh"

[expected]
t0 = "exploit"
t1 = "exploit"
