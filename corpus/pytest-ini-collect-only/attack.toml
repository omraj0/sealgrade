[attack]
id = "pytest-ini-collect-only"
title = "pytest.ini switches the run to --collect-only, which exits 0"
summary = """
A pytest.ini in the working directory sets addopts to --collect-only. pytest finds it as the
configuration file of the tests that were copied below it, collects them without running any, and
exits with status 0. A grader that trusts the exit code reports success.
"""
classes = ["V3", "V6", "V7"]
patterns = ["Trusting a process exit code", "Test the tests, not just the submissions"]

[files]
"pytest.ini" = "payload/pytest.ini"

[expected]
t0 = "exploit"
t1 = "blocked"
