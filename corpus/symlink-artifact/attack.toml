[attack]
id = "symlink-artifact"
title = "The declared artifact is a symlink to /etc/passwd"
summary = """
Boundary probe. A grader that copies the artifact out by following links would hand the
sandbox's (or the host's) files to the next stage.
"""
classes = ["V1", "V8"]
patterns = ["Excessive permissions"]
kind = "probe"
agent_script = "agent.sh"

[expected]
t0 = "blocked"
t1 = "blocked"
t2 = "blocked"
t3 = "blocked"
