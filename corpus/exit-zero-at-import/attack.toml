[attack]
id = "exit-zero-at-import"
title = "The solution prints a success line and exits 0 the moment it is imported"
summary = """
solution.py never defines the required function. On import it prints "N passed" and calls
os._exit(0), so the interpreter running the tests terminates with status 0 before a single
assertion executes.
"""
classes = ["V3", "V7"]
patterns = ["Trusting a process exit code", "Trusting output the submission can print"]

[files]
"solution.py" = "payload/solution.py"

[expected]
t0 = "exploit"
t1 = "blocked"
t3 = "blocked"
