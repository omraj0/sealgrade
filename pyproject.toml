[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sealgrade"
version = "0.1.0.dev0"
description = "Tamper-resistant evaluation runner, exploit corpus and auditor for untrusted, AI-generated code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Om Raj" }]
keywords = ["evaluation", "benchmarks", "sandbox", "reward-hacking", "ai-agents", "security", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "docker>=7.1",
  "rich>=13.7",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.scripts]
sealgrade = "sealgrade.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sealgrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
markers = [
  "docker: needs a running Docker daemon (skipped automatically when none is reachable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Attack payloads and sample tasks are intentionally unusual code; they are data, not source.
extend-exclude = ["corpus", "tasks"]

[tool.ruff.lint.per-file-ignores]
"src/sealgrade/report/render.py" = ["E501"]  # inline HTML/CSS template
"src/sealgrade/audit/render.py" = ["E501"]  # inline HTML/CSS template
"src/sealgrade/audit/rules.py" = ["E501"]  # human-readable finding messages
"tests/audit_fixtures.py" = ["E501"]  # embedded shell scripts
"src/sealgrade/report/svg.py" = ["E501"]  # inline SVG markup
"tools/mutation_table.py" = ["E501"]  # prose in the generated page
"tests/test_docker_tiers.py" = ["E501"]  # module docstring with a command line

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sealgrade"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Runs inside a Linux container; uses POSIX-only signal APIs that mypy on Windows does not model.
module = ["sealgrade.runner.guest.sg_exec"]
disable_error_code = ["attr-defined"]
