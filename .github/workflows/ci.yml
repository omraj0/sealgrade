name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Generated files are up to date
        run: |
          python tools/gen_cases.py --check
          python tools/gen_docs.py --check

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m "not docker" --cov=sealgrade --cov-report=term-missing

  docker:
    # Real containers on a clean Linux runner. A subset keeps pushes fast; the weekly workflow runs
    # the full matrix (see matrix-full.yml).
    runs-on: ubuntu-latest
    needs: [lint, unit]
    timeout-minutes: 60
    env:
      SEALGRADE_MATRIX_TASKS: py-slugify
      SEALGRADE_CONTROL_TASKS: py-slugify,py-roman,py-merge-intervals
      SEALGRADE_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Controls and documented attack outcomes (real containers)
        run: pytest -m docker -v

  audit-self:
    # The auditor audits this repository's own sample tasks and uploads SARIF to code scanning.
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: sealgrade audit tasks --format sarif --out sealgrade.sarif --fail-on high
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name == 'push'
        continue-on-error: true
        with:
          sarif_file: sealgrade.sarif
          category: sealgrade
